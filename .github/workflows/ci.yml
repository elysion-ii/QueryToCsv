name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build QueryToCsv.slnx -c Release

      # Boundary tests start a Linux SQL Server container, which Windows runners cannot
      # run; the boundary job below runs them.
      - name: Unit tests
        run: dotnet test QueryToCsv.Tests/QueryToCsv.Tests.csproj -c Release --filter "Category!=Boundary"

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Boundary tests
        run: dotnet test QueryToCsv.Tests/QueryToCsv.Tests.csproj -c Release --filter "Category=Boundary"
