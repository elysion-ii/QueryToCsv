name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build
        run: dotnet build QueryToCsv/QueryToCsv.csproj -c Release

      - name: Test
        run: dotnet test QueryToCsv.Tests/QueryToCsv.Tests.csproj -c Release
